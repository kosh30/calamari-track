[General]
DisableDefaultImports=false
# Zero tolerance: any warning fails the check.
MaxWarnings=0

# omarchy-shell types bar and Style.font as plain QtObject, so their members
# are invisible to the linter although they resolve at runtime. That is the
# only noise; imports and types must resolve (via lint/, see lint/README.md).
[Warnings]
MissingProperty=disable
